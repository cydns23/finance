<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="재정관리"><meta name="theme-color" content="#f7f3eb">
<title>재정관리 💰</title>
<meta name="app-version" content="v3">
<style>
:root{--bg:#f7f3eb;--card:#fffdf9;--ink:#25231f;--muted:#817b71;--line:#e8e1d6;--accent:#b88a43;--accent2:#ead9bb;--danger:#a55b51}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}body{min-height:100vh}.app{max-width:520px;margin:auto;padding:20px 16px 92px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title{font-size:24px;font-weight:800}.monthbar{display:flex;gap:8px;align-items:center}.monthbar input[type="month"]{width:142px;max-width:100%;height:38px;padding:0 8px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px;outline:none;color:var(--ink)}.monthbar input[type="month"]:focus{border-color:#c9a76e;box-shadow:0 0 0 2px #ead9bb}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #6d5b3b0d}.hero{padding:20px}.label{font-size:12px;color:var(--muted);margin-bottom:6px}.big{font-size:29px;font-weight:850;letter-spacing:-1px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini{padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff}.mini b{display:block;margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row .name{min-width:0;flex:1}.amount{font-weight:700;white-space:nowrap}.home-budget-input{width:118px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 8px;text-align:right;font-size:13px;font-weight:700;outline:none}.home-budget-input:focus{border-color:#c9a76e;box-shadow:0 0 0 2px #ead9bb}.pill{font-size:11px;color:#7d6848;background:#f3eadb;padding:4px 8px;border-radius:99px}.section-title{font-size:16px;font-weight:800;margin:4px 0 10px}.btn{border:0;border-radius:11px;background:var(--ink);color:white;padding:9px 12px;font-weight:700;font-size:13px}.btn.small{font-size:12px;padding:7px 9px}.btn.ghost{background:#f1ede5;color:#514b43}.btn.danger{background:transparent;color:var(--danger);padding:6px 7px;font-weight:600}.btn.add{background:transparent;color:#756246;border:1px dashed #cbbda7;padding:7px 10px;font-weight:700}.actions{display:flex;gap:6px;justify-content:flex-end}.input,.select{width:100%;height:42px;border:1px solid var(--line);border-radius:11px;background:white;padding:0 11px;font-size:14px;outline:none}.formrow{margin:10px 0}.formrow label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.event{padding:12px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.eventtop{display:flex;justify-content:space-between;gap:8px}.eventmeta{font-size:12px;color:var(--muted);margin-top:5px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fffdf9eF;border-top:1px solid var(--line);backdrop-filter:blur(12px);display:flex;justify-content:center;z-index:5}.tabs button{width:33.33%;max-width:170px;border:0;background:none;padding:10px 4px calc(10px + env(safe-area-inset-bottom));font-size:12px;color:var(--muted)}.tabs button.active{color:var(--ink);font-weight:800}.tabicon{display:block;font-size:18px;margin-bottom:2px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0005;display:flex;align-items:flex-end;justify-content:center;z-index:20}.sheet{width:100%;max-width:520px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheethead b{font-size:17px}.close{border:0;background:#eee8de;border-radius:50%;width:30px;height:30px}.empty{text-align:center;color:var(--muted);padding:24px 0;font-size:13px}@media(min-width:560px){.tabs{left:50%;right:auto;transform:translateX(-50%);width:520px}}
</style></head>
<body>
<div class="app">
  <div class="top"><div class="title">재정관리 💰</div><div class="monthbar"><input id="monthSelect" type="month" aria-label="년 월 선택"></div></div>
  <section id="homeView">
    <div class="card hero"><div class="label">이번 달 저축 가능액</div><div class="big" id="saveTotal">0원</div><div class="label" id="incomeText" style="margin-top:8px">수입 0원</div></div>
    <div class="grid"><div class="mini"><div class="label">전월 이월금액</div><b id="carryoverRemain">0원</b></div><div class="mini"><div class="label">자유생활비 남은 금액</div><b id="freeRemain">0원</b></div><div class="mini"><div class="label">데이트·여가비 남은 금액</div><b id="dateRemain">0원</b></div></div>
    <div class="card"><div class="section-title">예산 항목</div><div id="budgetList"></div></div>
    <div class="card"><div class="section-title">이번 달 이벤트</div><div id="eventList"></div><button class="btn add" id="addEvent">＋ 이벤트 추가</button></div>
  </section>
  <section id="historyView" class="hidden"><div class="card"><div class="section-title">저장된 기록</div><div id="historyList"></div></div></section>
  <section id="settingsView" class="hidden"><div class="card"><div class="section-title">수입 기본값</div><div class="formrow"><label>월급</label><input class="input" id="salary" type="text" inputmode="numeric"></div><div class="formrow"><label>추가소득</label><input class="input" id="extra" type="text" inputmode="numeric"></div><button class="btn small" id="saveIncome">저장</button></div><div class="card"><div class="section-title">예산 항목 설정</div><div id="settingsList"></div><button class="btn add" id="addCategory">＋ 항목 추가</button></div><div class="card"><div class="section-title">월 기록 저장</div><input class="input" id="memo" placeholder="메모 (선택)"><button class="btn small" id="saveRecord" style="margin-top:9px">이번 달 기록 저장</button></div></section>
</div>
<nav class="tabs"><button data-tab="home" class="active"><span class="tabicon">🏠</span>홈</button><button data-tab="history"><span class="tabicon">📝</span>기록</button><button data-tab="settings"><span class="tabicon">⚙️</span>설정</button></nav>
<div id="modal" class="modal hidden" aria-hidden="true"><div class="sheet"><div class="sheethead"><b id="modalTitle"></b><button type="button" class="close" id="closeModal" aria-label="닫기">×</button></div><div id="modalBody"></div></div></div>
<script>
const KEY='finance_app_v3';
const defaultCats=[['fixed','고정비',0],['food','식비',0],['free','자유생활비',0],['date','데이트·여가비',0],['youth','청년미래적금',0],['housing','청약',0]];
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{salary:0,extra:0,categories:defaultCats.map(x=>({id:x[0],name:x[1],budget:x[2]})),months:{},history:[]};
let current=new Date().toISOString().slice(0,7);
function fmt(n){return new Intl.NumberFormat('ko-KR').format(Math.round(Number(n)||0))+'원'}
function numFmt(n){return new Intl.NumberFormat('ko-KR').format(Math.max(0,Math.round(Number(n)||0)))}
function numVal(v){return Number(String(v??'').replace(/,/g,'').replace(/[^0-9]/g,''))||0}
function bindMoneyInput(el){if(!el)return;el.value=numFmt(numVal(el.value));el.addEventListener('input',()=>{const raw=el.value.replace(/[^0-9]/g,'');const n=raw?Number(raw):0;el.value=raw?numFmt(n):'';});}
function monthLabel(m){let [y,mo]=m.split('-');return `${y}년 ${Number(mo)}월`}
function ensure(){if(!data.months[current])data.months[current]={events:[]};}
function prevMonth(m){let [y,mo]=m.split('-').map(Number);mo--;if(mo===0){y--;mo=12}return `${y}-${String(mo).padStart(2,'0')}`}
function getCarryover(){const pm=prevMonth(current);const r=data.history.slice().reverse().find(x=>x.month===pm);return r?Math.max(0,Number(r.savings)||0):0}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function renderMonthSelect(){const s=document.getElementById('monthSelect');s.value=current}
function calc(){ensure();let ev=data.months[current].events;let carryover=getCarryover();let total=data.salary+data.extra+carryover;let base=data.categories.reduce((a,c)=>a+c.budget,0);let free=data.categories.find(c=>c.id==='free')?.budget||0;let date=data.categories.find(c=>c.id==='date')?.budget||0;let freeUsed=ev.filter(e=>e.source==='free').reduce((a,e)=>a+e.amount,0);let dateUsed=ev.filter(e=>e.source==='date').reduce((a,e)=>a+e.amount,0);let extraUsed=ev.filter(e=>e.source==='extra').reduce((a,e)=>a+e.amount,0);return{ev,total,carryover,base,freeRemain:free-freeUsed,dateRemain:date-dateUsed,savings:total-base-extraUsed-freeUsed-dateUsed}}
function renderHome(){ensure();let c=calc();document.getElementById('saveTotal').textContent=fmt(c.savings);document.getElementById('incomeText').innerHTML=`월 수입 ${fmt(data.salary+data.extra)}${c.carryover?`<br><span style=\"color:#8a6b3d\">전월 이월금액 +${fmt(c.carryover)}</span>`:''}`;document.getElementById('carryoverRemain').textContent=fmt(c.carryover);document.getElementById('freeRemain').textContent=fmt(c.freeRemain);document.getElementById('dateRemain').textContent=fmt(c.dateRemain);document.getElementById('budgetList').innerHTML=data.categories.map((x,i)=>`<div class="row"><span class="name">${escapeHtml(x.name)}</span><input class="home-budget-input" data-cat-index="${i}" type="text" inputmode="numeric" value="${numFmt(x.budget)}" aria-label="${escapeHtml(x.name)} 금액"></div>`).join('');document.querySelectorAll('.home-budget-input').forEach(el=>{bindMoneyInput(el);el.addEventListener('change',()=>{const i=Number(el.dataset.catIndex);data.categories[i].budget=Math.max(0,numVal(el.value));save();renderHome();renderSettings()});});document.getElementById('eventList').innerHTML=c.ev.length?c.ev.map((e,i)=>`<div class="event"><div class="eventtop"><b>${escapeHtml(e.name)}</b><button class="btn danger" onclick="deleteEvent(${i})">삭제</button></div><div class="eventmeta">${fmt(e.amount)} · ${e.source==='free'?'자유생활비':e.source==='date'?'데이트·여가비':'별도/추가'}</div></div>`).join(''):'<div class="empty">등록된 이벤트가 없어요.</div>'}
function renderSettings(){document.getElementById('salary').value=numFmt(data.salary);document.getElementById('extra').value=numFmt(data.extra);document.getElementById('settingsList').innerHTML=data.categories.map((x,i)=>`<div class="row"><div class="name"><b>${escapeHtml(x.name)}</b><div class="label" style="margin:3px 0 0">${fmt(x.budget)}</div></div><div class="actions"><button class="btn ghost small" onclick="editCat(${i})">✏️</button><button class="btn danger" onclick="deleteCat(${i})">삭제</button></div></div>`).join('')}
function renderHistory(){let h=data.history.slice().reverse();document.getElementById('historyList').innerHTML=h.length?h.map((r,i)=>`<div class="event"><div class="eventtop"><b>${monthLabel(r.month)}</b><div class="actions"><button class="btn ghost small" onclick="editRecord(${data.history.length-1-i})">수정</button><button class="btn danger" onclick="deleteRecord(${data.history.length-1-i})">삭제</button></div></div><div class="eventmeta">저축 가능액 ${fmt(r.savings)}${r.memo?' · '+escapeHtml(r.memo):''}</div></div>`).join(''):'<div class="empty">저장된 기록이 없어요.</div>'}
function render(){renderMonthSelect();renderHome();renderSettings();renderHistory()}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function openModal(title,html){const m=document.getElementById('modal');document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;m.classList.remove('hidden');m.setAttribute('aria-hidden','false')}
function closeModal(){const m=document.getElementById('modal');m.classList.add('hidden');m.setAttribute('aria-hidden','true');document.getElementById('modalBody').innerHTML=''}
function editCat(i){let c=data.categories[i];openModal('항목 이름 변경',`<div class="formrow"><label>항목 이름</label><input class="input" id="mName" value="${escapeHtml(c.name)}"></div><button class="btn" id="mSave">저장</button>`);document.getElementById('mSave').onclick=()=>{let n=document.getElementById('mName').value.trim();if(!n)return alert('항목 이름을 입력해주세요.');c.name=n;save();closeModal();render()}}
function deleteCat(i){if(data.categories.length<=1)return alert('항목은 최소 1개가 필요해요.');if(confirm(`“${data.categories[i].name}” 항목을 삭제할까요?`)){data.categories.splice(i,1);save();render()}}
function addCat(){openModal('항목 추가',`<div class="formrow"><label>항목 이름</label><input class="input" id="mName" placeholder="예: 강아지병원"></div><div class="formrow"><label>예산 금액</label><input class="input money-input" id="mBudget" type="text" inputmode="numeric" placeholder="0"></div><button class="btn" id="mSave">추가</button>`);bindMoneyInput(document.getElementById('mBudget'));document.getElementById('mSave').onclick=()=>{let n=document.getElementById('mName').value.trim();if(!n)return alert('항목 이름을 입력해주세요.');data.categories.push({id:'c'+Date.now(),name:n,budget:numVal(document.getElementById('mBudget').value)});save();closeModal();render()}}
function addEvent(){openModal('이벤트 추가',`<div class="formrow"><label>이벤트 이름</label><input class="input" id="eName" placeholder="예: 강릉 친구 여행"></div><div class="formrow"><label>금액</label><input class="input money-input" id="eAmount" type="text" inputmode="numeric" placeholder="0"></div><div class="formrow"><label>부담할 예산</label><select class="select" id="eSource"><option value="free">자유생활비</option><option value="date">데이트·여가비</option><option value="extra">별도/추가</option></select></div><button class="btn" id="eSave">추가</button>`);bindMoneyInput(document.getElementById('eAmount'));document.getElementById('eSave').onclick=()=>{let name=document.getElementById('eName').value.trim(),amount=numVal(document.getElementById('eAmount').value)||0,source=document.getElementById('eSource').value;if(!name||amount<=0)return alert('이벤트 이름과 금액을 입력해주세요.');ensure();data.months[current].events.push({name,amount,source});save();closeModal();render()}}
function deleteEvent(i){if(confirm('이 이벤트를 삭제할까요?')){data.months[current].events.splice(i,1);save();render()}}
function saveIncome(){data.salary=numVal(document.getElementById('salary').value);data.extra=numVal(document.getElementById('extra').value);save();render();alert('저장했어요.')}
function saveRecord(){let c=calc();let memo=document.getElementById('memo').value.trim();let idx=data.history.findIndex(x=>x.month===current);let rec={month:current,savings:c.savings,memo};if(idx>=0)data.history[idx]=rec;else data.history.push(rec);save();render();alert('이번 달 기록을 저장했어요.');}
function editRecord(i){let r=data.history[i];openModal('기록 수정',`<div class="label">${monthLabel(r.month)} · 저축 가능액 ${fmt(r.savings)}</div><div class="formrow"><label>메모</label><input class="input" id="mMemo" value="${escapeHtml(r.memo||'')}"></div><button class="btn" id="mSave">수정 저장</button>`);document.getElementById('mSave').onclick=()=>{if(confirm('정말 수정할까요?')){data.history[i].memo=document.getElementById('mMemo').value.trim();save();closeModal();render()}}}
function deleteRecord(i){if(confirm('정말 삭제할까요?')){data.history.splice(i,1);save();render()}}
document.getElementById('monthSelect').onchange=e=>{if(!e.target.value)return;current=e.target.value;ensure();render()};document.getElementById('addEvent').onclick=addEvent;document.getElementById('addCategory').onclick=addCat;document.getElementById('saveIncome').onclick=saveIncome;document.getElementById('saveRecord').onclick=saveRecord;document.getElementById('closeModal').addEventListener('click',function(e){e.preventDefault();e.stopPropagation();closeModal();});document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['home','history','settings'].forEach(t=>document.getElementById(t+'View').classList.toggle('hidden',t!==b.dataset.tab))});
ensure();render();bindMoneyInput(document.getElementById('salary'));bindMoneyInput(document.getElementById('extra'));
</script></body></html>
