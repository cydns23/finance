<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>재정관리 💰</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.app{max-width:560px;margin:auto;padding:16px 14px 40px}.top{margin:8px 2px 18px}.top h1{font-size:24px;margin:0}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #00000009}.title{font-weight:800;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:#6b7280;margin:0 0 6px}.field input,.field select,.row input,.row select{width:100%;padding:13px;border:1px solid #e5e7eb;border-radius:12px;background:#fff}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:14px;border-radius:15px;background:#f8fafc}.metric small{display:block;color:#6b7280;font-size:12px}.metric b{display:block;font-size:18px;margin-top:5px}.positive{color:#0f766e}.negative{color:#dc2626}.row{display:grid;grid-template-columns:1.15fr .85fr auto;gap:8px;align-items:end;margin:9px 0}.remove{border:0;background:#fee2e2;color:#b91c1c;border-radius:10px;padding:12px 10px}.add,.secondary{width:100%;border:1px solid #e5e7eb;background:#fff;padding:13px;border-radius:12px}.add{border-style:dashed;background:#f8fafc}.save{width:100%;border:0;background:#111827;color:#fff;padding:15px;border-radius:14px;font-weight:800;font-size:16px}.notice{font-size:12px;color:#6b7280;line-height:1.55}.history-item{border-top:1px solid #eef0f3;padding:13px 0}.history-item:first-child{border-top:0}.history-head{display:flex;justify-content:space-between;font-weight:800}.history-sub{font-size:12px;color:#6b7280;margin-top:5px}.history-actions{display:flex;gap:7px;margin-top:8px}.history-actions button{flex:1;padding:10px;border-radius:10px;border:1px solid #e5e7eb;background:#fff}.footer{font-size:11px;color:#9ca3af;text-align:center;margin-top:16px}@media(max-width:390px){.grid,.summary{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr auto}.row .ename{grid-column:1/-1}}
</style>
</head>
<body><main class="app">
<div class="top"><h1>재정관리 💰</h1></div>
<section class="card"><div class="title">📅 월 기록</div><div class="grid"><div class="field"><label>기록 월</label><input id="month" type="month"></div><div class="field"><label>월말 실제 저축액</label><input id="actual" type="number" inputmode="numeric" placeholder="선택"></div></div></section>
<section class="card"><div class="title">💵 수입</div><div class="grid"><div class="field"><label>월급</label><input id="salary" type="number" inputmode="numeric" value="2500000"></div><div class="field"><label>추가소득</label><input id="interest" type="number" inputmode="numeric" value="300000"></div></div></section>
<section class="card"><div class="title">✏️ 항목 이름 편집</div><div class="grid">
<div class="field"><label>항목 1 이름</label><input id="name_fixed" value="고정비"></div><div class="field"><label>항목 2 이름</label><input id="name_food" value="식비"></div><div class="field"><label>항목 3 이름</label><input id="name_free" value="자유생활비"></div><div class="field"><label>항목 4 이름</label><input id="name_travel" value="데이트·여가비"></div><div class="field"><label>항목 5 이름</label><input id="name_youth" value="청년미래적금"></div><div class="field"><label>항목 6 이름</label><input id="name_housing" value="청약"></div></div>
<p class="notice">예: 청약 → 강아지병원. 이름을 바꾸면 아래 예산 항목에도 바로 반영돼요.</p><button class="secondary" id="saveNames" type="button">항목 이름 저장</button></section>
<section class="card"><div class="title">📦 기본 예산</div><div class="grid">
<div class="field"><label id="label_fixed">고정비</label><input id="fixed" type="number" inputmode="numeric" value="1060000"></div><div class="field"><label id="label_food">식비</label><input id="food" type="number" inputmode="numeric" value="200000"></div><div class="field"><label id="label_free">자유생활비</label><input id="free" type="number" inputmode="numeric" value="300000"></div><div class="field"><label id="label_travel">데이트·여가비</label><input id="travel" type="number" inputmode="numeric" value="300000"></div><div class="field"><label id="label_youth">청년미래적금</label><input id="youth" type="number" inputmode="numeric" value="500000"></div><div class="field"><label id="label_housing">청약</label><input id="housing" type="number" inputmode="numeric" value="0"></div></div></section>
<section class="card"><div class="title">🎟️ 이번 달 이벤트 지출</div><div id="events"></div><button class="add" id="addEvent" type="button">＋ 이벤트 추가</button><p class="notice">자유생활비·데이트·여가비는 해당 예산 잔액에서 차감되고, 별도/추가는 저축 가능액에서 추가 차감돼요.</p></section>
<section class="card"><div class="title">📊 자동 계산</div><div class="summary"><div class="metric"><small>총수입</small><b id="income">₩0</b></div><div class="metric"><small>기본 예산</small><b id="base">₩0</b></div><div class="metric"><small>이벤트 지출</small><b id="eventTotal">₩0</b></div><div class="metric"><small>이번 달 저축 가능액</small><b id="saving">₩0</b></div><div class="metric"><small>자유생활비 잔액</small><b id="freeLeft">₩0</b></div><div class="metric"><small>데이트·여가비 잔액</small><b id="travelLeft">₩0</b></div></div></section>
<section class="card"><div class="title">📝 메모</div><textarea id="memo" rows="4" style="width:100%;border:1px solid #e5e7eb;border-radius:12px;padding:12px;resize:vertical" placeholder="이번 달 소비 메모"></textarea></section>
<button class="save" id="save" type="button">이번 달 기록 저장</button><div style="height:9px"></div><button class="secondary" id="reset" type="button">현재 입력 초기화</button>
<section class="card"><div class="title">📒 저장된 기록</div><div id="history"><div class="notice">아직 저장된 기록이 없어요.</div></div></section>
<div class="footer">기록은 이 브라우저의 기기에 저장됩니다.</div>
</main>
<script>
(function(){
'use strict';
const KEY='finance-records-v3', NAME_KEY='finance-budget-names-v2';
const $=id=>document.getElementById(id), won=n=>'₩'+Math.round(Number(n)||0).toLocaleString('ko-KR');
const defaults={fixed:'고정비',food:'식비',free:'자유생활비',travel:'데이트·여가비',youth:'청년미래적금',housing:'청약'};
function safeGet(k,f){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('기기에 저장할 수 없어요. 브라우저의 저장 권한을 확인해 주세요.');return false}}
function names(){return Object.assign({},defaults,safeGet(NAME_KEY,{}))}
function applyNames(){const n=names();Object.keys(defaults).forEach(k=>{if($('name_'+k))$('name_'+k).value=n[k];if($('label_'+k))$('label_'+k).textContent=n[k]})}
function vals(){return {salary:+$('salary').value||0,interest:+$('interest').value||0,fixed:+$('fixed').value||0,food:+$('food').value||0,free:+$('free').value||0,travel:+$('travel').value||0,youth:+$('youth').value||0,housing:+$('housing').value||0}}
function calc(){const v=vals(),income=v.salary+v.interest,base=v.fixed+v.food+v.free+v.travel+v.youth+v.housing;let eventTotal=0,freeSpent=0,travelSpent=0,extra=0;document.querySelectorAll('.event-row').forEach(r=>{const a=+r.querySelector('.eamt').value||0,s=r.querySelector('.esource').value;eventTotal+=a;if(s==='자유생활비')freeSpent+=a;else if(s==='데이트·여가비')travelSpent+=a;else extra+=a});const saving=income-base-extra;$('income').textContent=won(income);$('base').textContent=won(base);$('eventTotal').textContent=won(eventTotal);$('saving').textContent=won(saving);$('saving').className=saving<0?'negative':'positive';$('freeLeft').textContent=won(v.free-freeSpent);$('travelLeft').textContent=won(v.travel-travelSpent);$('freeLeft').className=v.free-freeSpent<0?'negative':'positive';$('travelLeft').className=v.travel-travelSpent<0?'negative':'positive'}
function addEvent(name='',amount=0,source='자유생활비'){const d=document.createElement('div');d.className='row event-row';d.innerHTML='<input class="ename" placeholder="예: 강릉 여행"><input class="eamt" type="number" inputmode="numeric" placeholder="금액"><select class="esource"><option>자유생활비</option><option>데이트·여가비</option><option>별도/추가</option></select><button class="remove" type="button">삭제</button>';d.querySelector('.ename').value=name;d.querySelector('.eamt').value=amount||'';d.querySelector('.esource').value=source;d.querySelector('.remove').onclick=function(){d.remove();calc()};d.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',calc));$('events').appendChild(d);calc()}
function collect(){const v=vals();return {month:$('month').value,actual:+$('actual').value||0,memo:$('memo').value,vals:v,names:names(),events:[...document.querySelectorAll('.event-row')].map(r=>({name:r.querySelector('.ename').value,amount:+r.querySelector('.eamt').value||0,source:r.querySelector('.esource').value})),savedAt:new Date().toISOString()}}
function loadRecords(){return safeGet(KEY,[])}
function renderHistory(){const h=$('history'),arr=loadRecords();if(!arr.length){h.innerHTML='<div class="notice">아직 저장된 기록이 없어요.</div>';return}h.innerHTML='';arr.forEach(r=>{const income=(r.vals.salary||0)+(r.vals.interest||0),base=Object.keys(defaults).reduce((a,k)=>a+(r.vals[k]||0),0),extra=(r.events||[]).filter(e=>e.source==='별도/추가').reduce((a,e)=>a+(e.amount||0),0),saving=income-base-extra;const d=document.createElement('div');d.className='history-item';d.innerHTML='<div class="history-head"><span></span><span></span></div><div class="history-sub"></div><div class="history-actions"><button type="button">불러오기·수정</button><button type="button">삭제</button></div>';d.querySelector('.history-head span:first-child').textContent=r.month;d.querySelector('.history-head span:last-child').textContent=won(saving);d.querySelector('.history-head span:last-child').className=saving<0?'negative':'positive';d.querySelector('.history-sub').textContent='이벤트 '+won((r.events||[]).reduce((a,e)=>a+(e.amount||0),0))+' · 실제 저축 '+(r.actual?won(r.actual):'미입력');d.querySelectorAll('button')[0].onclick=function(){if(confirm(r.month+' 기록을 수정할까요?')){applyRecord(r)}};d.querySelectorAll('button')[1].onclick=function(){if(confirm(r.month+' 기록을 정말 삭제할까요?')){const a=loadRecords().filter(x=>x.month!==r.month);safeSet(KEY,a);renderHistory()}};h.appendChild(d)})}
function applyRecord(r){const v=r.vals;Object.keys(v).forEach(k=>{if($(k))$(k).value=v[k]});$('month').value=r.month||'';$('actual').value=r.actual||'';$('memo').value=r.memo||'';if(r.names){safeSet(NAME_KEY,r.names)}applyNames();$('events').innerHTML='';(r.events||[]).forEach(e=>addEvent(e.name,e.amount,e.source));calc();window.scrollTo({top:0,behavior:'smooth'})}
$('saveNames').addEventListener('click',function(){const n={};Object.keys(defaults).forEach(k=>n[k]=($('name_'+k).value||defaults[k]).trim());if(safeSet(NAME_KEY,n)){applyNames();calc();alert('항목 이름을 저장했어요!')}});
$('addEvent').addEventListener('click',function(){addEvent()});
$('save').addEventListener('click',function(){const rec=collect();if(!rec.month){alert('기록 월을 먼저 선택해 주세요.');return}if(!confirm(rec.month+' 기록을 저장할까요?'))return;const a=loadRecords().filter(x=>x.month!==rec.month);a.push(rec);a.sort((x,y)=>y.month.localeCompare(x.month));if(safeSet(KEY,a)){renderHistory();alert(rec.month+' 기록을 저장했어요!')}});
$('reset').addEventListener('click',function(){if(confirm('현재 입력을 정말 초기화할까요?'))location.reload()});
document.querySelectorAll('input,textarea,select').forEach(x=>x.addEventListener('input',calc));
const now=new Date();$('month').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
applyNames();addEvent('강릉 친구 여행',150000,'별도/추가');addEvent('간사이 여행 옷 쇼핑',0,'자유생활비');renderHistory();calc();
})();
</script>
</body></html>
